spring.application.name=planora-backend
server.port=${PORT:8080}

# Profiles: default uses h2 for seamless out-of-the-box run, switch to mysql with spring.profiles.active=mysql
spring.profiles.active=h2

# JWT Configuration
planora.jwt.secret=9a674793666b6c22f676442ef5ca6be11d61a3346b3f9de78a2e7960ecbcff12
planora.jwt.expiration-ms=86400000

# OpenRouter / LLM AI Chatbot API configuration (Optional - fallback intelligent RAG engine active if empty)
planora.ai.api-key=${AI_API_KEY:}
planora.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
planora.ai.model=${AI_MODEL:gpt-3.5-turbo}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
